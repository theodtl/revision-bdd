c qui ont au moins un slot réseau, puis exclure à l’échelle du PC ceux qui ont au moins un slot son.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;

&lt;style&gt;
#qcm-bdd-2425 .exam-nav { margin: calc(var(--font-size-base) * .75) 0; }
#qcm-bdd-2425 .exam-nav label { display:flex; align-items:center; gap:.5em; }
#qcm-bdd-2425 .exam-page { position:relative; max-width:727px; margin-inline:auto; }
#qcm-bdd-2425 .exam-page img { display:block; width:100%; height:auto; }
#qcm-bdd-2425 .exam-choice {
 position:absolute; box-sizing:border-box; appearance:none; margin:0;
 background:#fff; color:#111; border:1px solid #111; border-radius:0;
}
#qcm-bdd-2425 .exam-choice::before { content:&quot;&quot;; position:absolute; inset:-4px; }
#qcm-bdd-2425 .exam-choice:checked { background:#111; }
#qcm-bdd-2425 .exam-choice[data-mark]::after {
 content:attr(data-mark); position:absolute; inset:0; display:grid; place-items:center;
 font: 500 clamp(7px, 2vw, 14px)/1 system-ui;
}
#qcm-bdd-2425 .exam-choice[data-mark=&quot;✓&quot;] { background:#d7f4dd; color:#134521; }
#qcm-bdd-2425 .exam-choice[data-mark=&quot;×&quot;] { background:#fce0df; color:#751f19; }
#qcm-bdd-2425 .exam-text {
 position:absolute; box-sizing:border-box; min-height:0; resize:none;
 background:#fff; color:#111;
}
#qcm-bdd-2425 .exam-explanation {
 margin: .35em 0 .75em;
 padding-inline-start: .8em;
 border-inline-start: 2px solid var(--border);
}
#qcm-bdd-2425 [data-action=&quot;check-open&quot;] { margin: .25em 0 .5em; }
#qcm-bdd-2425 [data-feedback] { margin-bottom:1em; }
&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
 const root = document.getElementById(&#x27;qcm-bdd-2425&#x27;);
 const key = {&quot;redond1b&quot;: [0.5, [2]], &quot;problemes1&quot;: [1.25, [5]], &quot;agregat&quot;: [1.25, [1]], &quot;merise&quot;: [1, [2]], &quot;pkey&quot;: [1, [1]], &quot;modcard&quot;: [1.25, [3]], &quot;profils&quot;: [1.5, [6, 7, 10, 11, 12]], &quot;attasso&quot;: [0.5, [2]], &quot;cardi&quot;: [1.25, [1, 3]], &quot;relation&quot;: [1, [1]], &quot;unique&quot;: [0.75, [2]], &quot;intref&quot;: [1.25, [3]], &quot;nbtables&quot;: [1.5, [2]], &quot;transcard&quot;: [1, [2, 3, 4]], &quot;unidef&quot;: [0.75, [3]], &quot;union&quot;: [0.75, [3]], &quot;minus&quot;: [0.75, [4]], &quot;natjoin&quot;: [0.75, [5]], &quot;proj&quot;: [0.75, [1]], &quot;valAD&quot;: [1, [1]], &quot;valD&quot;: [1, [1]], &quot;procs&quot;: [1.5, [4]], &quot;pcreseau&quot;: [0.5, [2]], &quot;cartespc&quot;: [1.5, [1]]};
 const select = root.querySelector(&#x27;select&#x27;);
 const choices = Array.from(root.querySelectorAll(&#x27;[data-question]&#x27;));
 const fields = root.querySelectorAll(&#x27;[data-open]&#x27;);
 const feedback = root.querySelector(&#x27;[data-feedback]&#x27;);
 const grade = root.querySelector(&#x27;[data-action=&quot;grade&quot;]&#x27;);
 const explanations = Array.from(root.querySelectorAll(&#x27;[data-explanation]&#x27;));
 const openReviewed = new Set();
 let corrected = false;

 function renderExplanation(question) {
   const panel = explanations.find(item =&gt; item.dataset.explanation === question);
   const selected = choices.filter(choice =&gt; choice.dataset.question === question &amp;&amp; choice.checked);
   const expected = key[question]?.[1];
   const verdict = panel.querySelector(&#x27;[data-verdict]&#x27;);
   if (!expected) {
     panel.hidden = !corrected &amp;&amp; !openReviewed.has(question);
     verdict.textContent = &#x27;Réponse attendue&#x27;;
     return;
   }
   panel.hidden = selected.length === 0;
   if (panel.hidden) return;
   const mistakes = selected.some(choice =&gt; !expected.includes(Number(choice.dataset.option)));
   verdict.textContent = mistakes ? &#x27;La sélection contient une erreur&#x27; :
     selected.length === expected.length ? &#x27;Correct selon le corrigé&#x27; : &#x27;Sélection incomplète&#x27;;
 }

 function showPage(page) {
   select.value = page;
   root.querySelectorAll(&#x27;[data-page]&#x27;).forEach(section =&gt; {
     section.hidden = Number(section.dataset.page) !== page;
   });
   root.querySelectorAll(&#x27;[data-action=&quot;prev&quot;]&#x27;).forEach(button =&gt; { button.disabled = page === 1; });
   root.querySelectorAll(&#x27;[data-action=&quot;next&quot;]&#x27;).forEach(button =&gt; { button.disabled = page === 6; });
 }

 function renderCorrection() {
   feedback.hidden = !corrected;
   explanations.forEach(panel =&gt; renderExplanation(panel.dataset.explanation));
   grade.textContent = corrected ? &#x27;Masquer la correction&#x27; : &#x27;Afficher la correction&#x27;;
   grade.setAttribute(&#x27;aria-pressed&#x27;, String(corrected));
   const balance = {};
   choices.forEach(choice =&gt; {
     const { question, option } = choice.dataset;
     const right = key[question][1].includes(Number(option));
     if (corrected) choice.dataset.mark = right ? &#x27;✓&#x27; : choice.checked ? &#x27;×&#x27; : &#x27;○&#x27;;
     else delete choice.dataset.mark;
     if (choice.checked) balance[question] = (balance[question] || 0) + (right ? 1 : -1);
   });
   if (corrected) {
     let points = 0;
     let total = 0;
     for (const [question, [maximum, answers]] of Object.entries(key)) {
       points += Math.max(0, balance[question] || 0) * maximum / answers.length;
       total += maximum;
     }
     root.querySelector(&#x27;[data-score]&#x27;).textContent =
       &#x27;Score des questions à cocher : &#x27; + points.toLocaleString(&#x27;fr-FR&#x27;, { maximumFractionDigits: 2 }) +
       &#x27; / &#x27; + total.toLocaleString(&#x27;fr-FR&#x27;) + &#x27; points. Les deux réponses ouvertes (3,5 points) sont à relire.&#x27;;
   }
 }

 function persist() {
   window.openai?.setWidgetState?.({
     privateContent: {
       page: Number(select.value), corrected, openReviewed: Array.from(openReviewed),
       choices: choices.filter(choice =&gt; choice.checked).map(choice =&gt; choice.dataset.question + &#x27;:&#x27; + choice.dataset.option),
       fields: Object.fromEntries(Array.from(fields).map(field =&gt; [field.dataset.open, field.value.slice(0, 1400)]))
     }
   })?.catch(() =&gt; {});
 }

 function restore(state) {
   if (!state || !Array.isArray(state.choices)) return;
   choices.forEach(choice =&gt; {
     choice.checked = state.choices.includes(choice.dataset.question + &#x27;:&#x27; + choice.dataset.option);
   });
   fields.forEach(field =&gt; { field.value = state.fields?.[field.dataset.open] || &#x27;&#x27;; });
   openReviewed.clear();
   if (Array.isArray(state.openReviewed)) {
     state.openReviewed.filter(question =&gt; question === &#x27;efaible&#x27; || question === &#x27;valC&#x27;)
       .forEach(question =&gt; openReviewed.add(question));
   }
   corrected = state.corrected === true;
   showPage(Number.isInteger(state.page) &amp;&amp; state.page &gt;= 1 &amp;&amp; state.page &lt;= 6 ? state.page : 1);
   renderCorrection();
 }

 root.addEventListener(&#x27;click&#x27;, event =&gt; {
   const action = event.target.dataset.action;
   if (action === &#x27;grade&#x27;) {
     corrected = !corrected;
     renderCorrection();
   } else if (action === &#x27;check-open&#x27;) {
     const question = event.target.dataset.target;
     const field = root.querySelector(&#x27;[data-open=&quot;&#x27; + question + &#x27;&quot;]&#x27;);
     if (!field.value.trim()) {
       field.focus();
       return;
     }

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");

      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );

  let state = null;

    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);

    widgetState: state,
    statePersistence: storage == null ? "none" : "local",

  channel.port1.addEventListener("message", (event) => {

        typeof height !== "number" ||
        !Number.isFinite(height) ||

        frame.style.height = Math.ceil(height) + "px";

            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,

    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true

      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);

  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });

  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );

    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");

        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000

      }

      // Ignore missing or invalid cache entries and measure the live frame.
    }

  delete frame.dataset.srcdoc;
})();
